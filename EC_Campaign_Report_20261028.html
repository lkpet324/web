<style>

  --text:#2f2823;
  --line:#eee8e2;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.8 "Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;letter-spacing:.1px}
a{color:inherit}
.page{max-width:1320px;margin:0 auto;padding:30px 24px 70px}
.shell{background:var(--paper);border-radius:36px;padding:34px 34px 52px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.65)}
.hero{display:grid;grid-template-columns:1.12fr .88fr;gap:22px;align-items:stretch;margin-bottom:34px}
.hero-main{background:var(--card);border-radius:30px;padding:42px 46px;border:1px solid var(--line);position:relative;overflow:hidden}

.kicker{font-size:12px;letter-spacing:2.6px;color:var(--muted);font-weight:700;margin-bottom:14px}
.brandline{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hero h1{font-family:"Noto Serif TC", Georgia, serif;font-size:52px;line-height:1.08;margin:0 0 14px;letter-spacing:.2px;font-weight:700}

.switches{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{border:1px solid #e5d8ce;background:transparent;color:#6d6056;padding:11px 20px;border-radius:999px;font-weight:700;cursor:pointer;transition:.2s}
.btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 10px 20px rgba(216,148,92,.22)}
.btn.print{background:#fff}
.hero-side{background:linear-gradient(180deg,#fff, #fbf8f4);border:1px solid var(--line);border-radius:30px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero-side:before{content:"";position:absolute;inset:auto -30px -50px auto;width:220px;height:220px;background:rgba(216,148,92,.10);border-radius:50%}
.hero-side h3{font-family:"Noto Serif TC", Georgia, serif;font-size:30px;line-height:1.15;margin:0 0 12px;position:relative;z-index:1}
.hero-side p{margin:0 0 16px;color:#7a6d63;position:relative;z-index:1}
.hero-side .summary{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mini{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px}
.mini .label{font-size:12px;color:#8a7e75;margin-bottom:4px}
.mini .value{font-size:25px;font-weight:800;color:#2d241f}
.section-nav{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 28px}
.section-nav a{text-decoration:none;background:var(--chip);border:1px solid var(--line);padding:9px 15px;border-radius:999px;font-size:13px;color:#755f51}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:30px}
.metric{background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px 24px 20px;box-shadow:0 8px 18px rgba(66,43,24,.025)}
.metric .name{font-size:13px;color:#8d7d73}
.metric .value{font-size:32px;font-weight:850;line-height:1.25;margin-top:6px}
.metric .foot{font-size:12px;color:#908278}
.up{color:#c66520} .down{color:#b84e40}
.block{margin-top:32px}
.block-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.block-title{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.block-no{font-size:14px;color:var(--accent);font-weight:800;letter-spacing:1px}
.block h2{font-family:"Noto Serif TC", Georgia, serif;font-size:34px;line-height:1.15;margin:0}
.block-sub{font-size:13px;color:#93857b}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px 30px;box-shadow:0 8px 20px rgba(88,56,31,.03)}
.card + .card{margin-top:18px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.years{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
.year-card{background:#fbf8f5;border:1px solid var(--line);border-radius:24px;padding:22px}
.year-card .year{font-size:13px;color:#886f5f;font-weight:800;letter-spacing:1px}
.year-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.year-grid div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 16px}
.year-grid span{display:block;font-size:12px;color:#8b7d74}
.year-grid b{display:block;font-size:24px;margin-top:4px}
.comparison-strip{margin-top:16px;background:linear-gradient(90deg,#fbf2eb,#fff9f4);border:1px solid #efdfd1;border-radius:20px;padding:14px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:#7a614e}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:right;background:#f8f4f0;color:#786355;padding:11px 13px;white-space:nowrap;font-weight:800}
.table td{text-align:right;padding:12px 13px;border-bottom:1px solid #f1e9e2;white-space:nowrap}
.table th:first-child,.table td:first-child{text-align:left}
.table tr:last-child td{border-bottom:0}
.table .focus td{background:#fff8f2}
.table .total td{font-weight:800;background:#fcfaf8;border-top:2px solid #ead8cb}
.small{font-size:12px;color:#8f8379;margin:.8rem 0 0}
.note{padding:14px 16px;border-radius:18px;background:#fbf3ec;color:#866b56;border:1px solid #f0e1d5;margin-top:16px;font-size:13px}
.pie-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.pie-card{background:#fcfaf8;border:1px solid var(--line);border-radius:22px;padding:18px}
.pie-card h5{margin:0 0 10px;font-size:14px;color:#5d493c}
.pie-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.pie-svg{width:160px;height:160px;flex:0 0 160px}
.pie-legend{flex:1;min-width:190px;display:flex;flex-direction:column;gap:8px}
.pie-item{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:12px;color:#5b4a3e;border-bottom:1px dashed #ebe0d7;padding-bottom:5px}
.pie-item:last-child{border-bottom:0;padding-bottom:0}
.pie-label{display:flex;gap:8px;align-items:center}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block;margin-top:3px}
.muted{color:#927f72}
.legend{display:flex;gap:18px;align-items:center;font-size:12px;color:#8d7f75;margin:0 0 12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:#e2c2a6;margin-right:6px}
.dot.cur{background:#e57c2f}
.mix-wrap{margin-top:14px}
.mix-svg{width:100%;height:auto;display:block;background:linear-gradient(180deg,#fff,#fffbf7);border-radius:20px;border:1px solid var(--line)}
.mix-bar{fill:#efd5bc}
.mix-bar-current{fill:#d8945c}
.mix-line{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.mix-point{fill:var(--accent);stroke:#fff;stroke-width:2}
.axis-label{font-size:11px;fill:#8b7f75}
.value-label{font-size:10px;fill:#6d5e51}
.grid-line{stroke:#efe7e0;stroke-width:1}
.event-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.event-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px}
.event-card h4{margin:0 0 10px;font-size:16px;color:#634c3f}
.insight{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.insight article{background:linear-gradient(180deg,#fff,#fbf8f4);border:1px solid var(--line);border-radius:24px;padding:24px}
.insight strong{display:block;font-family:"Noto Serif TC", Georgia, serif;font-size:24px;margin-bottom:10px;color:#3e3128}
.insight p{margin:0;color:#67584c}
.orange-band{margin-top:34px;background:linear-gradient(135deg,#d8945c,#d08a52);border-radius:34px;color:#fff;padding:36px 36px 32px;display:grid;grid-template-columns:1.1fr .9fr;gap:26px;overflow:hidden;position:relative}
.orange-band:after{content:"";position:absolute;right:-50px;top:-20px;width:240px;height:240px;border:18px solid rgba(255,255,255,.08);border-radius:38% 62% 59% 41% / 43% 39% 61% 57%;transform:rotate(-15deg)}
.orange-band h3{font-family:"Noto Serif TC", Georgia, serif;font-size:44px;line-height:1.08;margin:0 0 12px;position:relative;z-index:1}
.orange-band p{margin:0;color:rgba(255,255,255,.84);position:relative;z-index:1}
.badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;position:relative;z-index:1}
.badge{background:rgba(255,255,255,.94);color:#4c392d;border-radius:20px;padding:18px 18px 16px}
.badge b{display:block;font-size:17px;margin-bottom:6px}
.badge span{font-size:13px;color:#765f50}
@media (max-width:1100px){.hero,.orange-band{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.pie-grid,.event-grid,.insight,.years{grid-template-columns:1fr}}
@media (max-width:720px){.page{padding:12px}.shell{padding:18px 18px 28px;border-radius:24px}.hero-main{padding:28px}.hero h1{font-size:38px}.hero-side h3{font-size:26px}.block h2{font-size:28px}.orange-band h3{font-size:32px}.metrics{grid-template-columns:1fr 1fr}.year-grid{grid-template-columns:1fr 1fr}.btn{padding:9px 14px}.table{font-size:12px}.table th,.table td{padding:8px 7px}}
@media print{body{background:#fff}.page{padding:0}.shell{box-shadow:none;border:0;background:#fff;padding:0}.btn.print,.section-nav{display:none}.card,.metric,.hero-main,.hero-side,.orange-band,.event-card,.year-card,.insight article{box-shadow:none}@page{size:A4 landscape;margin:10mm}}

function buildPieSVG(items,key){const total=items.reduce((s,x)=>s+Number(x[key]||0),0); if(!total) return '<svg viewBox="0 0 160 160" class="pie-svg"><circle cx="80" cy="80" r="56" fill="#f1ece7"></circle><text x="80" y="80" text-anchor="middle" font-size="12" fill="#8e8178">無資料</text></svg>'; const cx=80,cy=80,r=56; let start=-Math.PI/2; const paths=items.map((item,idx)=>{const val=Number(item[key]||0), ratio=val/total, end=start+ratio*Math.PI*2; const x1=cx+r*Math.cos(start), y1=cy+r*Math.sin(start), x2=cx+r*Math.cos(end), y2=cy+r*Math.sin(end); const large=(end-start)>Math.PI?1:0; const path=`M ${cx} ${cy} L ${x1.toFixed(3)} ${y1.toFixed(3)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(3)} ${y2.toFixed(3)} Z`; start=end; return `<path d="${path}" fill="${PIE_COLORS[idx % PIE_COLORS.length]}"></path>`;}).join(''); return '<svg viewBox="0 0 160 160" class="pie-svg">'+paths+'<circle cx="80" cy="80" r="28" fill="#fff"></circle><text x="80" y="73" text-anchor="middle" font-size="11" fill="#8d7d6d">合計</text><text x="80" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#3b3028">'+fmt(total)+'</text></svg>';}
function pieCard(title,items,key,unit=''){const total=items.reduce((s,x)=>s+Number(x[key]||0),0); const legend=items.map((item,idx)=>{const val=Number(item[key]||0); const label=key==='revenue'?money(val):fmt(val)+(unit?(' '+unit):''); return '<div class="pie-item"><div class="pie-label"><span class="swatch" style="background:'+PIE_COLORS[idx % PIE_COLORS.length]+'"></span><span>'+safe(item.name)+'</span></div><div><div>'+label+'</div><div class="muted">'+pct(total?val/total:0)+'</div></div></div>';}).join(''); return '<div class="pie-card"><h5>'+title+'</h5><div class="pie-box">'+buildPieSVG(items,key)+'<div class="pie-legend">'+legend+'</div></div></div>';}
function buildMixedChart(year26,year25){
 const labels=year26.map(x=>monthLabel(x.period));
 const vals26=year26.map(x=>Number(x.revenue||0));
 const vals25=year26.map(x=>Number(year25.find(y=>monthLabel(y.period)===monthLabel(x.period))?.revenue||0));
 const max=Math.max(...vals26,...vals25,1)*1.13;
 const w=760,h=320,left=64,right=28,top=24,bottom=48;
 const cw=w-left-right,ch=h-top-bottom,groupW=cw/labels.length;
 const xAt=i=>left+groupW*(i+.5),yAt=v=>top+ch-(v/max)*ch;
 const grid=[0,.25,.5,.75,1].map(r=>{const value=Math.round(max*r),y=yAt(value);return `<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}" class="grid-line"></line><text x="${left-8}" y="${y+4}" text-anchor="end" class="axis-label">${fmt(value)}</text>`}).join('');
 const barW=Math.min(48,groupW*.28);
 const bars=labels.map((label,i)=>{
   return [[vals25[i],-1,'mix-bar'],[vals26[i],1,'mix-bar-current']].map(([v,side,cls])=>{
     const center=xAt(i)+side*(barW*.58),y=yAt(v);
     return `<rect x="${center-barW/2}" y="${y}" width="${barW}" height="${top+ch-y}" rx="5" class="${cls}"></rect><text x="${center}" y="${y-8}" text-anchor="middle" class="value-label">${fmt(v)}</text>`;
   }).join('');
 }).join('');
 const xlabels=labels.map((label,i)=>`<text x="${xAt(i)}" y="${h-15}" text-anchor="middle" class="axis-label">${label}</text>`).join('');
 return '<div class="card mix-wrap"><div class="block-head" style="margin-bottom:6px"><div><h3 style="margin:0;font-size:18px;font-family:Noto Serif TC,Georgia,serif">各月營收趨勢｜雙長條比較</h3><div class="block-sub">2025、2026 年各月收入並排比較（10 月為 1–21 日）</div></div></div><div class="legend"><span><i class="dot"></i>2025 收入</span><span><i class="dot cur"></i>2026 收入</span></div><svg viewBox="0 0 '+w+' '+h+'" class="mix-svg" role="img" aria-label="2025 與 2026 年月份收入長條比較圖">'+grid+bars+xlabels+'</svg></div>';
}

  monthComparison='；較上月（'+(currentMonth-1)+' 月，'+fmt(prev.days)+' 個營業日）營收 '+signed(change,true)+

   '（本月 '+money(v.c.avg)+'／上月 '+money(prev.avg)+'）';
 }

  {title:'① 同期及上月經營表現',text:periodText()+' 營收 '+money(v.c.revenue)+'（'+fmt(v.c.days)+' 個營業日），較 2025 年同期 '+signed(v.rev,true)+monthComparison+'。'+partial},

 ];
 return '<div class="insight">'+parts.map(x=>'<article><strong>'+x.title+'</strong><p>'+x.text+'</p></article>').join('')+'</div>';
}

let reportMode='detail';
function overviewBranch(b){let d=DATA[b], months=b==='西門'?[7,8,9,10]:[9,10];return months.map(m=>{let x=d.year26.find(v=>+v.period.slice(0,2)===m);let y=d.year25.find(v=>+v.period.slice(0,2)===m);return {month:m, ...x,prev:y,partial:m===10};});}
function overviewTable(b){let rows=overviewBranch(b),sum=0,sumVisits=0,sumDays=0,prior=null;
 const body=rows.map(x=>{sum+=x.revenue;sumVisits+=x.visits;sumDays+=x.days;let growth=prior===null?null:getpct(x.revenue,prior);prior=x.revenue;let yoy=x.prev?getpct(x.revenue,x.prev.revenue):null;
 return tr([x.month+' 月'+(x.partial?' *':''),money(x.revenue),fmt(x.visits),fmt(x.days),money(x.avg),growth===null?'—':'<span class="'+(growth>=0?'up':'down')+'">'+signed(growth,true)+'</span>',yoy===null?'—':'<span class="'+(yoy>=0?'up':'down')+'">'+signed(yoy,true)+'</span>',money(sum)])}).join('');
 return {rows, sum,sumVisits,sumDays, html:table(['月份','營收','來客','營業日','日均營收','較前月','去年同期','累計營收'],[body,tr(['合計',money(sum),fmt(sumVisits),fmt(sumDays),money(sumDays?sum/sumDays:0),'—','—',money(sum)],'total')])};}
function overviewChart(b,kind='revenue'){let rows=overviewBranch(b),width=770,height=312,left=67,right=22,top=39,bottom=52,max=Math.max(1,...rows.map(r=>kind==='revenue'?r.revenue:r.visits))*1.18,unit=kind==='revenue'?'NT$ ':'',w=width-left-right,h=height-top-bottom,bw=Math.min(72,w/rows.length*.36);
 const grid=[0,.25,.5,.75,1].map(fr=>{let v=Math.ceil(max*fr),y=top+h-(v/max)*h;return '<line class="grid-line" x1="'+left+'" x2="'+(width-right)+'" y1="'+y+'" y2="'+y+'"/><text class="axis-label" text-anchor="end" x="'+(left-10)+'" y="'+(y+4)+'">'+fmt(v)+'</text>';}).join('');
 const bars=rows.map((r,i)=>{let x=left+(i+.5)*w/rows.length,v=kind==='revenue'?r.revenue:r.visits,y=top+h-(v/max)*h;return '<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+(top+h-y)+'" rx="8" fill="'+(r.partial?'#e5b791':'#bc8056')+'"/><text class="value-label" text-anchor="middle" x="'+x+'" y="'+(y-10)+'">'+fmt(v)+'</text><text class="axis-label" text-anchor="middle" x="'+x+'" y="'+(height-18)+'">'+r.month+' 月'+(r.partial?' *':'')+'</text>';}).join('');
 return '<svg class="mix-svg" role="img" aria-label="'+b+'逐月'+(kind==='revenue'?'營收':'來客')+'趨勢" viewBox="0 0 '+width+' '+height+'">'+grid+bars+'</svg>';}
function overviewSummary(b){let o=overviewTable(b),rs=o.rows,last=rs.at(-1),first=rs[0],full=rs.filter(x=>!x.partial),peak=full.reduce((a,x)=>x.revenue>a.revenue?x:a,full[0]);return {html:'<div class="overview-metrics"><div class="metric"><div class="name">累計營收</div><div class="value">'+money(o.sum)+'</div><div class="foot">'+rs[0].month+'–10 月，10 月截至 28 日</div></div><div class="metric"><div class="name">累計來客</div><div class="value">'+fmt(o.sumVisits)+' 人次</div><div class="foot">各月來客人次加總</div></div><div class="metric"><div class="name">累計營業天數</div><div class="value">'+fmt(o.sumDays)+' 天</div><div class="foot">各月營業日相加</div></div><div class="metric"><div class="name">期間日均營收</div><div class="value">'+money(o.sumDays?o.sum/o.sumDays:0)+'</div><div class="foot">累計營收 ÷ 累計營業天數</div></div></div><div class="card" style="margin-top:16px"><div class="block-head"><h3 style="margin:0">'+b+'院｜各月營收趨勢</h3></div>'+overviewChart(b)+'</div><div class="card"><div class="block-head"><h3 style="margin:0">'+b+'院｜逐月比較與累計</h3></div><div class="scroll-table">'+o.html+'</div></div>',sum:o.sum,visits:o.sumVisits,days:o.sumDays};}
function renderOverview(){let west=overviewSummary('西門'),center=overviewSummary('中山');document.getElementById('main').innerHTML='<section class="hero"><div class="hero-main"><div class="kicker">OPERATIONS REPORT · 2026</div><h1>營運<span class="accent">成長總覽</span></h1><p>西門院 7–10 月｜中山院 9–10 月</p><div class="switches"><button class="btn active" onclick="setReportMode(\'overview\')">累計總覽</button><button class="btn" onclick="setReportMode(\'detail\')">單月明細</button><button class="btn print" onclick="window.print()">列印／存成 PDF</button></div></div><aside class="hero-side"><h3>營運期間累計</h3><div class="summary"><div class="mini"><div class="label">西門院累計營收</div><div class="value">'+money(west.sum)+'</div></div><div class="mini"><div class="label">中山院累計營收</div><div class="value">'+money(center.sum)+'</div></div><div class="mini"><div class="label">西門院累計來客</div><div class="value">'+fmt(west.visits)+'</div></div><div class="mini"><div class="label">中山院累計來客</div><div class="value">'+fmt(center.visits)+'</div></div></div></aside></section><nav class="section-nav"><a href="#west">01 西門院</a><a href="#center">02 中山院</a><a href="#both">03 院所對照</a></nav><section class="block" id="west"><div class="block-head"><div class="block-title"><span class="block-no">01</span><h2>西門院｜7–10 月累計</h2></div></div>'+west.html+'</section><section class="block" id="center"><div class="block-head"><div class="block-title"><span class="block-no">02</span><h2>中山院｜9–10 月累計</h2></div></div>'+center.html+'</section><section class="block" id="both"><div class="block-head"><div class="block-title"><span class="block-no">03</span><h2>兩院趨勢比較</h2></div></div><div class="card"><h3>營收共同期間比較｜9–10 月</h3><div class="scroll-table">'+table(['月份','西門院','中山院','兩院合計'],[9,10].map(m=>{let a=overviewBranch('西門').find(x=>x.month===m),b=overviewBranch('中山').find(x=>x.month===m);return tr([m+' 月'+(m===10?' *':''),money(a.revenue),money(b.revenue),money(a.revenue+b.revenue)])}))+'</div></div><div class="card"><h3>西門院來客趨勢</h3>'+overviewChart('西門','visits')+'</div><div class="card"><h3>中山院來客趨勢</h3>'+overviewChart('中山','visits')+'</div></section><p class="overview-foot">* 10 月僅統計 10/01–10/28，屬未結束月份。與完整月份比較時，請同時參考日均營收。西門院與中山院開始統計的月份不同，兩院總累計不適合作為相同期間的直接比較；共同月份請參考 9–10 月對照。</p>';}
function setReportMode(m){reportMode=m;render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){if(reportMode==='overview'){renderOverview();return;}const d=currentData(), v=compareData(d); document.getElementById('main').innerHTML = '<section class="hero"><div class="hero-main"><div class="kicker">OPERATIONS REPORT · 2026</div><div class="brandline"><div><h1>'+d.name+'<span class="accent"> 營運報告</span></h1><p>2026 年 '+selectedMonth+' 月營運概覽｜同期收入、客戶結構及導客活動成效</p></div></div><div class="switches"><button class="btn" onclick="setReportMode(&quot;overview&quot;)">累計總覽</button><button class="btn active" onclick="setReportMode(&quot;detail&quot;)">單月明細</button><button class="btn '+(branch==='中山'?'active':'')+'" onclick="switchBranch(&quot;中山&quot;)">中山院</button><button class="btn '+(branch==='西門'?'active':'')+'" onclick="switchBranch(&quot;西門&quot;)">西門院</button><span class="month-select-wrap"><label for="monthSelect">月份</label><select id="monthSelect" class="month-select" onchange="switchMonth(this.value)">'+(branch==='西門'?['7','8','9','10']:['9','10']).map(m=>'<option value="'+m+'" '+(selectedMonth===m?'selected':'')+'>'+m+' 月</option>').join('')+'</select></span><button class="btn print" onclick="window.print()">列印／存成 PDF</button></div></div><aside class="hero-side"><div><h3>'+reportIcon('clipboard')+'營運摘要</h3><p>統計區間：2026/'+periodText()+'；同期比較基準：2025/'+periodText()+'。</p></div><div class="summary"><div class="mini"><div class="label">'+reportIcon('wallet')+'同期收入</div><div class="value">'+money(v.c.revenue)+'</div></div><div class="mini"><div class="label">'+reportIcon('trend')+'收入增減</div><div class="value '+(v.rev>=0?'up':'down')+'">'+signed(v.rev,true)+'</div></div><div class="mini"><div class="label">'+reportIcon('calendar')+'營業天數</div><div class="value">'+fmt(v.c.days)+' 天</div></div><div class="mini"><div class="label">'+reportIcon('calendar')+'休診天數</div><div class="value">'+fmt(v.c.closed)+' 天</div></div></div>'+heroPhoto()+'</aside></section>'
 + '<nav class="section-nav"><a href="#sec1">01 收入同期</a><a href="#sec2">02 寵物與客源</a><a href="#sec3">03 導客活動</a><a href="#sec4">04 分析結論</a></nav>'
 + '<div class="metrics">'+metric(reportIcon('wallet')+'2026 同期醫療收入',money(v.c.revenue),'2025 同期 '+money(v.p.revenue),v.rev)+metric(reportIcon('chart')+'日均營業額',money(v.c.avg),'去年同期 '+money(v.p.avg),v.day)+metric(reportIcon('users')+'來客人次',fmt(v.c.visits)+' 人次','去年同期 '+fmt(v.p.visits)+' 人次',v.vis)+metric(reportIcon('trend')+'平均客單',money(v.c.ticket),'去年同期 '+money(v.p.ticket),v.ticket)+'</div>'
 + '<section class="block" id="sec1"><div class="block-head"><div class="block-title"><span class="block-no">01</span>'+reportIcon('chart')+'<h2>收入同期比對</h2></div><div class="block-sub">2025 vs 2026｜月份收入雙長條圖</div></div>'+renderRevenue(d)+'</section>'
 + '<section class="block" id="sec2"><div class="block-head"><div class="block-title"><span class="block-no">02</span>'+reportIcon('paw')+'<h2>寵物數及收益／客戶來源別</h2></div><div class="block-sub">依寵物別與客戶來源分項呈現</div></div>'+renderStructure(d)+'</section>'
 + '<section class="block" id="sec3"><div class="block-head"><div class="block-title"><span class="block-no">03</span>'+reportIcon('gift')+'<h2>導客活動方案統計</h2></div><div class="block-sub">分活動類別、筆數與金額</div></div>'+renderEvents(d)+'</section>'
 + '<section class="block" id="sec4"><div class="block-head"><div class="block-title"><span class="block-no">04</span>'+reportIcon('clipboard')+'<h2>營運分析結論</h2></div><div class="block-sub">經營表現與客源結構</div></div>'+renderConclusions(d)+'</section>';
}
function switchMonth(m){if(!DATA[branch].months[String(m)])return;selectedMonth=String(m);render();}
function switchBranch(b){if(!DATA[b])return;branch=b;if(!DATA[b].months[selectedMonth])selectedMonth='10';render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script>
</body>
</html>
