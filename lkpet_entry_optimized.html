<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ed">
<meta name="description" content="慈愛動物醫院活動專區｜皮膚檢測計劃與犬心絲蟲4Dx篩檢。">
<title>慈愛動物醫院｜健康活動專區</title>
<style>
:root{
  color-scheme:light;
  --bg:#f7f3ed;
  --paper:#fffdfa;
  --ink:#493e36;
  --sub:#766b61;
  --line:#e8dfd4;
  --accent:#846951;
  --accent-dark:#6f5643;
  --chip:#efe4d7;
  --shadow:0 18px 40px rgba(68,50,35,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:linear-gradient(180deg,#fbf8f4 0%, var(--bg) 100%);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body:before{
  content:"";
  position:fixed;
  inset:0 0 auto;
  height:420px;
  z-index:-1;
  background:
    radial-gradient(circle at 10% 4%,#ece0d2 0,transparent 42%),
    radial-gradient(circle at 94% 12%,#f0e8de 0,transparent 38%);
}
a{color:inherit}
.wrap{max-width:960px;margin:auto;padding:48px 18px 32px}
.head{text-align:center;margin:0 auto 28px;max-width:680px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.22em;color:#8b7463;font-weight:650}
.eyebrow:before,.eyebrow:after{content:"";width:24px;height:1px;background:#c7b8a8}
.brand-logo{display:block;width:min(310px,78vw);height:auto;object-fit:contain;margin:0 auto 22px}.head h1{font-size:clamp(30px,5.3vw,42px);font-weight:700;letter-spacing:.08em;margin:16px 0 12px}
.head p{margin:0;color:var(--sub);font-size:14px;line-height:1.9;letter-spacing:.02em}
.cards{display:grid;grid-template-columns:1fr;gap:18px}
.card{
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  background:var(--paper);
  box-shadow:var(--shadow);
}
.poster-link{display:block;padding:14px 14px 0;text-decoration:none}
.poster-frame{
  background:#f6f1ea;
  border:1px solid #eee2d6;
  border-radius:18px;
  padding:10px;
}
.poster{display:block;width:100%;height:auto;border-radius:12px}
.body{padding:20px 20px 22px}
.tag{display:inline-block;background:var(--chip);color:#907762;font-size:11px;font-weight:700;letter-spacing:.14em;border-radius:999px;padding:7px 10px}
.body h2{font-size:24px;font-weight:700;letter-spacing:.03em;margin:12px 0 8px;line-height:1.35}
.body p{font-size:14px;line-height:1.85;color:var(--sub);margin:0 0 18px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:52px;
  padding:14px 18px;
  border-radius:12px;
  background:var(--accent);
  color:#fff;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
  letter-spacing:.04em;
}
.btn:hover,.btn:focus-visible{background:var(--accent-dark)}
.btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none}
.footer{text-align:center;color:#a09386;font-size:12px;letter-spacing:.07em;margin:30px 0 0}
.footer:before{content:"";display:block;width:42px;height:1px;background:#d6cabe;margin:0 auto 18px}
a:focus-visible{outline:3px solid #af9a82;outline-offset:4px}
@media (min-width: 760px){
  .wrap{padding:56px 22px 34px}
  .head{margin-bottom:34px}
  .head p{font-size:15px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
  .poster-link{padding:16px 16px 0}
  .body{padding:24px 24px 26px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
